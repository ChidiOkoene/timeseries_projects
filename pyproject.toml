[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timeseries"
version = "0.1.0"
description = "Research toolkit for crypto OHLC forecasting, ensembles, PIDL, and chart-pattern vision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chidi Okoene" }]
keywords = ["timeseries", "fintech", "crypto", "forecasting", "yolo", "xrp"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "python-binance>=1.0.19",
]

[project.optional-dependencies]
forecast = [
  "tensorflow>=2.13",
  "keras>=3.0",
  "xgboost>=1.7",
]
vision = [
  "ultralytics>=8.0",
  "mplfinance>=0.12",
]
tradingview = [
  "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
]
all = [
  "timeseries[forecast,vision,tradingview]",
]
dev = [
  "ipykernel>=6.25",
  "jupyter>=1.0",
]

[project.urls]
Repository = "https://github.com/ChidiOkoene/timeseries_projects"

[tool.setuptools.packages.find]
where = ["src"]
